[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenable-net"
version = "1.1.0"
description = "Query Tenable Vulnerability Management bulk exports and explore network-equipment findings"
requires-python = ">=3.10"
dependencies = [
    "pytenable>=1.5",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest"]

[project.scripts]
tenable-net = "tenable_net.cli:main"

[project.gui-scripts]
tenable-net-gui = "tenable_net.gui.app:main"

[tool.setuptools.packages.find]
include = ["tenable_net*"]

[tool.setuptools.package-data]
"tenable_net.gui" = ["fonts/*.otf", "fonts/LICENSE.txt"]
